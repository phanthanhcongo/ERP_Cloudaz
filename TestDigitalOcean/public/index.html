<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DO Billing Test</title>
<style>
  /* ── Design tokens ─────────────────────────────────── */
  :root{
    --bg:#f7f8fa; --card:#fff; --sunk:#f3f5f8;
    --bd:#e2e6eb; --bd2:#eef0f4; --bd3:#f1f3f6;
    --fg:#111822; --fg2:#3c4654; --mut:#6b7684; --mut2:#949db0;
    --ac:#0062ff; --ac-h:#0052d6; --ac-sf:#eaf2ff; --ac-bd:#b9d4ff;
    --ok:#0a7d4a; --ok-sf:#e7f7ef; --err:#c0303c; --err-sf:#fdecee;
    --warn:#8a6100; --warn-sf:#fff6e0;
    --sh1:0 1px 2px rgba(17,24,34,.05);
    --sh2:0 1px 3px rgba(17,24,34,.07), 0 4px 12px -2px rgba(17,24,34,.06);
    --sh-pop:0 8px 28px -6px rgba(17,24,34,.18);
    --r:10px; --r-sm:7px;
    --ff:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    --fm:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme=light]){
      --bg:#0c0f14; --card:#151a21; --sunk:#1b212a;
      --bd:#293038; --bd2:#222831; --bd3:#1d232b;
      --fg:#e8ecf2; --fg2:#c3cad4; --mut:#8f99a8; --mut2:#6e7886;
      --ac:#5c9dff; --ac-h:#7db0ff; --ac-sf:#13233c; --ac-bd:#2b4a7a;
      --ok:#48c98a; --ok-sf:#0f2a1e; --err:#ff8a93; --err-sf:#2e1518;
      --warn:#e0b341; --warn-sf:#2b2210;
      --sh1:0 1px 2px rgba(0,0,0,.5);
      --sh2:0 1px 3px rgba(0,0,0,.5), 0 4px 14px -4px rgba(0,0,0,.5);
      --sh-pop:0 10px 32px -8px rgba(0,0,0,.7);
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.55 var(--ff);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  :focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:4px}
  ::selection{background:var(--ac-sf);color:var(--fg)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ── Header ────────────────────────────────────────── */
  header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:11px;
    padding:0 20px;height:54px;background:color-mix(in srgb,var(--card) 88%,transparent);
    backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--bd)}
  header .mark{width:26px;height:26px;border-radius:7px;flex:0 0 auto;
    background:linear-gradient(145deg,#2f8bff,#0062ff);color:#fff;
    display:grid;place-items:center;font:700 12.5px/1 var(--ff);letter-spacing:-.03em;
    box-shadow:0 2px 6px -1px rgba(0,98,255,.5)}
  header h1{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.012em}
  header h1 small{display:block;font-size:11.5px;font-weight:450;color:var(--mut);
    letter-spacing:0;margin-top:1px}
  header .right{margin-left:auto;display:flex;align-items:center;gap:9px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:550;
    padding:4px 10px;border-radius:999px;border:1px solid var(--bd);color:var(--mut);
    background:var(--card);white-space:nowrap}
  .pill i{width:6px;height:6px;border-radius:50%;background:var(--mut2);flex:0 0 auto}
  .pill.y{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--bd));background:var(--ok-sf)}
  .pill.y i{background:var(--ok)}
  .pill.n{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--bd));background:var(--warn-sf)}
  .pill.n i{background:var(--warn)}

  main{max-width:1240px;margin:0 auto;padding:20px 20px 80px}

  /* ── Card ──────────────────────────────────────────── */
  .card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);
    box-shadow:var(--sh1);padding:16px 18px;margin-bottom:16px}
  .card.lift{box-shadow:var(--sh2)}
  h2{margin:0 0 14px;font-size:11px;font-weight:650;letter-spacing:.07em;
    text-transform:uppercase;color:var(--mut);display:flex;align-items:center;
    gap:9px;flex-wrap:wrap}

  /* ── Form ──────────────────────────────────────────── */
  label{display:block;font-size:11.5px;font-weight:600;color:var(--fg2);
    margin-bottom:6px;letter-spacing:.005em}
  label .hint{font-weight:450;color:var(--mut2)}
  input,select{width:100%;height:38px;padding:0 11px;border:1px solid var(--bd);
    border-radius:var(--r-sm);background:var(--card);color:var(--fg);
    font:inherit;transition:border-color .13s,box-shadow .13s,background .13s}
  input::placeholder{color:var(--mut2)}
  input:hover,select:hover{border-color:var(--mut2)}
  input:focus,select:focus{outline:none;border-color:var(--ac);
    box-shadow:0 0 0 3.5px var(--ac-sf)}
  input[type=month]{min-width:148px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .row>.f{flex:1 1 220px;min-width:0}
  .row>.fx{flex:0 0 auto}

  /* ── Button ────────────────────────────────────────── */
  button{display:inline-flex;align-items:center;justify-content:center;gap:7px;
    height:38px;padding:0 14px;border:1px solid var(--bd);background:var(--card);
    color:var(--fg2);border-radius:var(--r-sm);cursor:pointer;
    font:550 13.5px/1 var(--ff);white-space:nowrap;box-shadow:var(--sh1);
    transition:background .13s,border-color .13s,color .13s,box-shadow .13s,transform .08s}
  button:hover{background:var(--sunk);border-color:var(--mut2);color:var(--fg)}
  button:active{transform:translateY(1px);box-shadow:none}
  button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;
    box-shadow:0 1px 2px rgba(0,98,255,.3)}
  button.p:hover{background:var(--ac-h);border-color:var(--ac-h);color:#fff}
  button.on{background:var(--ac-sf);border-color:var(--ac-bd);color:var(--ac);font-weight:650}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--sh1)}
  button:disabled:hover{background:var(--card);border-color:var(--bd);color:var(--fg2)}
  .btns{display:flex;gap:8px;flex-wrap:wrap}

  /* ── Thanh filter kỳ ───────────────────────────────── */
  .filter{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .stepper{display:inline-flex;height:38px;border:1px solid var(--bd);
    border-radius:var(--r-sm);overflow:hidden;background:var(--card);box-shadow:var(--sh1)}
  .stepper button{height:100%;border:0;border-radius:0;box-shadow:none;width:34px;padding:0;
    font-size:17px;color:var(--mut)}
  .stepper button:hover{color:var(--ac);background:var(--ac-sf)}
  .stepper input{height:100%;border:0;border-left:1px solid var(--bd);
    border-right:1px solid var(--bd);border-radius:0;text-align:center;
    font-weight:600;font-variant-numeric:tabular-nums}
  .stepper input:focus{box-shadow:none;background:var(--ac-sf)}
  .seg{display:inline-flex;height:38px;padding:3px;gap:2px;background:var(--card);
    border:1px solid var(--bd);border-radius:var(--r-sm);box-shadow:var(--sh1)}
  .seg button{height:100%;border:0;border-radius:5px;box-shadow:none;padding:0 12px;
    font-size:13px;background:none;color:var(--mut)}
  .seg button:hover{background:var(--sunk);color:var(--fg)}
  .seg button.on{background:var(--ac);color:#fff;font-weight:600}
  .seg button.on:hover{background:var(--ac-h);color:#fff}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--ac-sf);
    color:var(--ac);border:1px solid var(--ac-bd);border-radius:999px;
    padding:3px 5px 3px 11px;font:650 12px/1.4 var(--ff);text-transform:none;letter-spacing:0}
  .chip button{width:18px;height:18px;padding:0;border:0;border-radius:50%;
    background:none;box-shadow:none;color:inherit;font-size:14px}
  .chip button:hover{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac)}

  /* ── Status ────────────────────────────────────────── */
  .st{display:flex;align-items:center;gap:8px;min-height:21px;font-size:13px;
    color:var(--mut);margin-top:15px;padding-top:13px;border-top:1px solid var(--bd2)}
  .st code{font:12px var(--fm);background:var(--sunk);padding:1.5px 5px;
    border-radius:4px;border:1px solid var(--bd2)}
  .st .sp{width:13px;height:13px;flex:0 0 auto;border:2px solid var(--bd);
    border-top-color:var(--ac);border-radius:50%;animation:spin .55s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .st.e{color:var(--err)} .st.o{color:var(--ok)}
  .st.e::before,.st.o::before{font-weight:700}
  .st.e::before{content:"✕"} .st.o::before{content:"✓"}
  .rl{margin-left:auto;font:11.5px/1 var(--fm);color:var(--mut2);
    background:var(--sunk);border:1px solid var(--bd2);padding:4px 8px;border-radius:5px}

  /* ── KPI ───────────────────────────────────────────── */
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px}
  .kpi>div{position:relative;padding:12px 13px;border:1px solid var(--bd);
    border-radius:9px;background:linear-gradient(180deg,var(--card),var(--sunk));
    overflow:hidden}
  .kpi>div::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--ac-bd)}
  .kpi span{display:block;font-size:10.5px;font-weight:650;color:var(--mut);
    text-transform:uppercase;letter-spacing:.06em}
  .kpi b{display:block;margin-top:5px;font-size:21px;font-weight:650;
    letter-spacing:-.025em;font-variant-numeric:tabular-nums;
    overflow-wrap:anywhere;line-height:1.2}

  /* ── Table ─────────────────────────────────────────── */
  .tw{overflow:auto;max-height:66vh;border:1px solid var(--bd);border-radius:9px;
    background:var(--card);-webkit-overflow-scrolling:touch}
  .tw::-webkit-scrollbar{width:11px;height:11px}
  .tw::-webkit-scrollbar-thumb{background:var(--bd);border-radius:6px;
    border:3px solid var(--card)}
  .tw::-webkit-scrollbar-thumb:hover{background:var(--mut2)}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
  th,td{padding:8px 11px;text-align:left;white-space:nowrap;
    border-bottom:1px solid var(--bd3)}
  th{position:sticky;top:0;z-index:1;background:var(--sunk);color:var(--mut);
    font:650 10.5px/1.5 var(--ff);text-transform:uppercase;letter-spacing:.06em;
    border-bottom:1px solid var(--bd)}
  tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--sunk) 45%,transparent)}
  tbody tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  td.mono{font:12.5px var(--fm);color:var(--mut)}
  tbody tr.clk{cursor:pointer}
  tbody tr.clk:hover td{background:var(--ac-sf);color:var(--fg)}
  tbody tr.clk:hover td:first-child{box-shadow:inset 3px 0 0 var(--ac)}
  tfoot td{position:sticky;bottom:0;font-weight:650;background:var(--sunk);
    border-top:1px solid var(--bd);border-bottom:0}

  /* ── Hóa đơn ───────────────────────────────────────── */
  .inv .sec{display:flex;align-items:center;gap:10px;margin:26px 0 11px;
    font:650 11px/1 var(--ff);letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
  .inv .sec::after{content:"";flex:1;height:1px;background:var(--bd)}
  .inv .sec:first-child{margin-top:0}
  .inv h3{display:flex;align-items:baseline;gap:9px;margin:20px 0 9px;
    font-size:14px;font-weight:650;letter-spacing:-.01em;
    padding-bottom:7px;border-bottom:1px solid var(--bd)}
  .inv h3 .amt{margin-left:auto;font:600 14px/1 var(--fm);color:var(--mut)}
  .sum{max-width:520px;border:1px solid var(--bd);border-radius:9px;overflow:hidden}
  .sum td{padding:9px 13px;border-bottom:1px solid var(--bd3)}
  .sum td:first-child{color:var(--fg2)}
  .sum td.n{font-variant-numeric:tabular-nums}
  .sum tr:last-child td{border-bottom:0}
  .sum tr.due td{background:var(--sunk);font-weight:700;font-size:16px;
    border-top:2px solid var(--fg);border-bottom:0;padding:11px 13px}
  .sum td.neg{color:var(--ok);font-weight:600}
  .ck{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
    font:650 11.5px/1.6 var(--ff)}
  .ck.y{color:var(--ok);background:var(--ok-sf)}
  .ck.n{color:var(--err);background:var(--err-sf)}
  .bar{height:6px;min-width:64px;border-radius:999px;background:var(--bd2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--ac),#5c9dff)}


  /* ── Layout 2 cột: danh sách team | chi tiết ─────── */
  .split{display:grid;grid-template-columns:316px 1fr;gap:16px;align-items:start}
  @media (max-width:900px){.split{grid-template-columns:1fr}}

  .side{position:sticky;top:70px;background:var(--card);border:1px solid var(--bd);
    border-radius:var(--r);box-shadow:var(--sh1);overflow:hidden;
    display:flex;flex-direction:column;max-height:calc(100vh - 92px)}
  @media (max-width:900px){.side{position:static;max-height:none}}
  .side-h{padding:13px 14px 11px;border-bottom:1px solid var(--bd);background:var(--card)}
  .side-h .ttl{display:flex;align-items:baseline;gap:8px;margin-bottom:11px}
  .side-h .ttl b{font-size:13px;font-weight:650;letter-spacing:-.01em}
  .side-h .ttl span{font-size:11.5px;color:var(--mut);margin-left:auto;
    font-variant-numeric:tabular-nums}
  .side-h input{height:34px;font-size:13px}

  .tlist{overflow-y:auto;flex:1;padding:6px}
  .tlist::-webkit-scrollbar{width:10px}
  .tlist::-webkit-scrollbar-thumb{background:var(--bd);border-radius:5px;
    border:3px solid var(--card)}

  .titem{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;
    border:1px solid transparent;border-radius:7px;background:none;box-shadow:none;
    cursor:pointer;text-align:left;height:auto;font:inherit;color:inherit}
  .titem:hover{background:var(--sunk);border-color:var(--bd2)}
  .titem.on{background:var(--ac-sf);border-color:var(--ac-bd)}
  .titem.on .tn{color:var(--ac);font-weight:650}
  .titem .av{flex:0 0 auto;width:28px;height:28px;border-radius:7px;display:grid;
    place-items:center;font:650 11px/1 var(--ff);letter-spacing:-.02em;
    background:var(--sunk);color:var(--mut);border:1px solid var(--bd)}
  .titem.ok .av{background:var(--ok-sf);color:var(--ok);
    border-color:color-mix(in srgb,var(--ok) 30%,var(--bd))}
  .titem .tx{min-width:0;flex:1}
  .titem .tn{display:block;font-size:13px;font-weight:550;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .titem .te{display:block;font-size:11px;color:var(--mut);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .titem .bd{flex:0 0 auto;font:650 9.5px/1 var(--ff);letter-spacing:.04em;
    text-transform:uppercase;padding:3px 5px;border-radius:4px;
    background:var(--sunk);color:var(--mut2);border:1px solid var(--bd2)}
  .titem.ok .bd{background:var(--ok-sf);color:var(--ok);border-color:transparent}

  /* ── Pane chi tiết ───────────────────────────────── */
  .pane{min-width:0}
  .ph{display:flex;align-items:flex-start;gap:13px;padding:16px 18px;
    background:var(--card);border:1px solid var(--bd);border-radius:var(--r);
    box-shadow:var(--sh1);margin-bottom:14px}
  .ph .av{flex:0 0 auto;width:46px;height:46px;border-radius:11px;display:grid;
    place-items:center;font:650 17px/1 var(--ff);letter-spacing:-.03em;
    background:linear-gradient(145deg,#2f8bff,#0062ff);color:#fff;
    box-shadow:0 3px 9px -2px rgba(0,98,255,.45)}
  .ph .meta{min-width:0;flex:1}
  .ph h2.nm{margin:0 0 3px;font-size:19px;font-weight:650;letter-spacing:-.022em;
    text-transform:none;color:var(--fg);display:block}
  .ph .sub{font-size:12.5px;color:var(--mut);display:flex;gap:7px;
    flex-wrap:wrap;align-items:center}
  .ph .sub code{font:11.5px var(--fm);background:var(--sunk);padding:2px 6px;
    border-radius:4px;border:1px solid var(--bd2)}
  .ph .acts{flex:0 0 auto;display:flex;gap:7px;flex-wrap:wrap}

  .noauth{padding:30px 22px;text-align:center}
  .noauth .ic{font-size:26px;margin-bottom:10px;opacity:.5}
  .noauth b{display:block;font-size:14.5px;margin-bottom:7px}
  .noauth p{margin:0 auto;max-width:460px;font-size:13px;color:var(--mut);line-height:1.6}
  .noauth code{font:12px var(--fm);background:var(--sunk);padding:2px 6px;
    border-radius:4px;border:1px solid var(--bd2)}

  .ph-empty{display:grid;place-items:center;min-height:300px;text-align:center;
    color:var(--mut);padding:20px}
  .ph-empty .ic{font-size:32px;opacity:.3;margin-bottom:12px}


  /* ── Hóa đơn: bố cục như chứng từ giấy ───────────── */
  .doc{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);
    box-shadow:var(--sh2);overflow:hidden}

  /* Đầu hóa đơn */
  .doc-top{display:flex;gap:18px;flex-wrap:wrap;padding:20px 22px;
    border-bottom:1px solid var(--bd);
    background:linear-gradient(180deg,var(--sunk),var(--card))}
  .doc-top .who{flex:1 1 230px;min-width:0}
  .doc-top .vendor{font:650 15px/1.3 var(--ff);letter-spacing:-.015em}
  .doc-top .vendor span{display:block;font:450 12px/1.5 var(--ff);color:var(--mut);margin-top:2px}
  .doc-top .right{flex:0 0 auto;text-align:right}
  .doc-top .lbl{font:650 10px/1 var(--ff);letter-spacing:.08em;text-transform:uppercase;
    color:var(--mut);margin-bottom:5px}
  .doc-top .num{font:650 19px/1 var(--fm);letter-spacing:-.01em}
  .doc-top .per{margin-top:7px;font-size:12.5px;color:var(--mut)}

  /* Dải tiền nổi bật */
  .doc-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    border-bottom:1px solid var(--bd)}
  .doc-sum>div{padding:13px 16px;border-right:1px solid var(--bd2)}
  .doc-sum>div:last-child{border-right:0}
  .doc-sum .k{font:650 10px/1 var(--ff);letter-spacing:.07em;text-transform:uppercase;
    color:var(--mut)}
  .doc-sum .v{margin-top:6px;font:650 19px/1.15 var(--ff);letter-spacing:-.025em;
    font-variant-numeric:tabular-nums}
  .doc-sum .v.neg{color:var(--ok)}
  .doc-sum .due{background:var(--ac-sf)}
  .doc-sum .due .k{color:var(--ac)}
  .doc-sum .due .v{color:var(--ac);font-size:22px}

  /* Thân */
  .doc-body{padding:20px 22px 22px}
  .doc-sec{display:flex;align-items:center;gap:10px;margin:26px 0 12px;
    font:650 11px/1 var(--ff);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
  .doc-sec:first-child{margin-top:0}
  .doc-sec::after{content:"";flex:1;height:1px;background:var(--bd)}
  .doc-sec .n{display:grid;place-items:center;width:19px;height:19px;flex:0 0 auto;
    border-radius:50%;background:var(--sunk);border:1px solid var(--bd);
    font:650 10px/1 var(--ff);color:var(--mut)}

  /* Bảng thông tin dạng nhãn-giá trị */
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1px;
    background:var(--bd2);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
  .kv>div{background:var(--card);padding:9px 12px}
  .kv .k{font:650 10px/1 var(--ff);letter-spacing:.06em;text-transform:uppercase;
    color:var(--mut)}
  .kv .v{margin-top:4px;font-size:13.5px;overflow-wrap:anywhere}
  .kv .v.mono{font:12.5px var(--fm);color:var(--fg2)}

  /* Bảng tổng hợp tiền */
  .tot{width:100%;max-width:470px;border:1px solid var(--bd);border-radius:8px;
    overflow:hidden;border-collapse:separate;border-spacing:0}
  .tot td{padding:9px 13px;border-bottom:1px solid var(--bd3);white-space:nowrap}
  .tot td:first-child{color:var(--fg2);white-space:normal}
  .tot td.n{text-align:right;font-variant-numeric:tabular-nums;width:1%}
  .tot tr:last-child td{border-bottom:0}
  .tot td.neg{color:var(--ok);font-weight:600}
  .tot tr.due td{background:var(--ac-sf);color:var(--ac);font-weight:700;font-size:16px;
    border-top:2px solid var(--ac-bd);border-bottom:0;padding:11px 13px}

  /* Bảng tổng nhóm, có thanh tỉ lệ */
  .grp td.bar-c{width:120px;padding-right:16px}
  .bar{height:6px;border-radius:999px;background:var(--bd2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--ac),#5c9dff)}
  .grp tbody tr:hover td{background:var(--ac-sf)}
  .grp .pct{font:11.5px/1 var(--fm);color:var(--mut2);margin-top:3px;display:block}

  /* Thanh mở/thu nhóm */
  .gtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}
  .gtools button{height:30px;padding:0 11px;font-size:12.5px}
  .gtools .gnote{margin-left:auto;font-size:12px;color:var(--mut);
    font-variant-numeric:tabular-nums}

  /* Từng nhóm sản phẩm */
  .gsec{margin-top:12px;border:1px solid var(--bd);border-radius:9px;overflow:hidden}
  .gsec>summary{display:flex;align-items:center;gap:10px;padding:11px 14px;

  .gsec>summary::-webkit-details-marker{display:none}

  .gsec>summary .amt{margin-left:auto;font:650 14px/1 var(--fm);

  .gsec .tw{border:0;border-radius:0;border-top:1px solid var(--bd);max-height:none}

  /* Chuyển chế độ xem trong 1 nhóm */
  .vmode{display:flex;align-items:center;gap:6px;flex-wrap:wrap;

  .vmode button{height:29px;padding:0 10px;font-size:12.5px;gap:6px}
  .vmode button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}

  .vmode button .c{font:11px/1 var(--fm);opacity:.75}
  .vmode .vnote{margin-left:auto;font-size:11.5px;color:var(--mut2)}
  .vw.hid{display:none}

  /* Mục đối chiếu */
  .chk{display:grid;gap:8px}
  .chk>div{display:flex;align-items:center;gap:11px;padding:10px 13px;
    border:1px solid var(--bd);border-radius:8px;background:var(--card);flex-wrap:wrap}
  .chk .ic{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:grid;
    place-items:center;font:700 11px/1 var(--ff)}
  .chk .y .ic{background:var(--ok-sf);color:var(--ok)}
  .chk .n .ic{background:var(--err-sf);color:var(--err)}
  .chk .lb{font-size:13.5px;font-weight:500}
  .chk .vl{margin-left:auto;font:650 13.5px/1 var(--fm);font-variant-numeric:tabular-nums}
  .chk .nt{flex:1 1 100%;font-size:12px;color:var(--mut);padding-left:31px}
  .chk .n{border-color:color-mix(in srgb,var(--err) 35%,var(--bd));background:var(--err-sf)}

  /* Dải kết luận đối chiếu */
  .verdict{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 15px;
    border-radius:8px;font-size:13.5px;font-weight:600}
  .verdict.y{background:var(--ok-sf);color:var(--ok);
    border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
  .verdict.n{background:var(--err-sf);color:var(--err);
    border:1px solid color-mix(in srgb,var(--err) 30%,transparent)}

  .doc-acts{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px;
    border-top:1px solid var(--bd);background:var(--sunk)}

  @media (max-width:720px){
    .doc-top,.doc-body{padding:15px}
    .doc-top .right{text-align:left}
    .doc-sum>div{border-right:0;border-bottom:1px solid var(--bd2)}
    .doc-acts{padding:12px 15px}
    .grp td.bar-c{display:none}
    .grp th.bar-c{display:none}
  }
  @media print{
    .doc{box-shadow:none;border:0}
    .doc-acts{display:none}
    .gsec{break-inside:avoid}
    .gsec>summary::before{display:none}
  }

  /* ── Misc ──────────────────────────────────────────── */
  pre{margin:0;padding:13px 14px;border-radius:9px;overflow:auto;max-height:400px;
    background:#0b0f15;color:#cfd8e3;font:12.5px/1.55 var(--fm);
    border:1px solid #1d2530}
  a{color:var(--ac);text-decoration-color:color-mix(in srgb,var(--ac) 35%,transparent);
    text-underline-offset:2px}
  a:hover{color:var(--ac-h)}
  .empty{padding:36px 20px;text-align:center;color:var(--mut)}
  .empty b{display:block;color:var(--fg2);font-size:14px;margin-bottom:4px}
  .empty span{font-size:13px}
  details>summary{cursor:pointer;display:flex;align-items:center;gap:7px;
    font:650 11px/1 var(--ff);letter-spacing:.07em;text-transform:uppercase;
    color:var(--mut);list-style:none;padding:2px 0}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:"▸";font-size:11px;transition:transform .15s}
  details[open]>summary::before{transform:rotate(90deg)}
  details>summary:hover{color:var(--fg)}
  .skel{height:13px;border-radius:4px;background:linear-gradient(90deg,
    var(--bd3) 25%,var(--bd2) 37%,var(--bd3) 63%);background-size:400% 100%;
    animation:sh 1.3s ease-in-out infinite}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

  @media (max-width:720px){
    header{padding:0 14px;height:50px}
    header h1 small{display:none}
    main{padding:14px 12px 64px}
    .card{padding:14px;border-radius:9px}
    .row>.f{flex:1 1 100%}
    .filter{gap:11px;padding:12px}
    .filter>.fx{flex:1 1 100%}
    .stepper,.seg{width:100%}
    .stepper input{flex:1}
    .seg button{flex:1}
    .btns button{flex:1 1 auto}
    .kpi{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
    .kpi b{font-size:18px}
    th,td{padding:7px 9px}
  }
  @media print{
    header,.filter,.btns,details,#status{display:none!important}
    body{background:#fff}
    .card{box-shadow:none;border:0;padding:0;margin-bottom:18px}
    .tw{max-height:none;overflow:visible;border-color:#ccc}
    th{background:#f3f3f3}
  }
/* ── Modal bảng đối soát ── */

<body>
<header>
  <span class="mark">DO</span>
  <h1>Billing Explorer<small>DigitalOcean · test lấy dữ liệu cước</small></h1>
  <div class="right">
    <a href="/recon.html" id="recon-link" class="pill" style="text-decoration:none">📋 Đối soát</a>
    <span class="pill" id="envPill"><i></i>đang kiểm tra…</span>
  </div>
</header>

<main>
  <div class="split">

    <!-- Cột trái: danh sách team -->
    <aside class="side">
      <div class="side-h">
        <div class="ttl"><b>Teams</b><span id="tCount">đang tải…</span></div>
        <input type="search" id="tSearch" placeholder="Tìm theo tên hoặc email…"
               autocomplete="off" aria-label="Tìm team">
      </div>
      <div class="tlist" id="tList"></div>
    </aside>

    <!-- Cột phải: chi tiết team đang chọn -->
    <section class="pane" id="pane">
      <div class="card ph-empty">
        <div><div class="ic">◳</div>Chọn một team ở cột bên trái để xem chi tiết.</div>
      </div>
    </section>

  </div>
</main>

<!-- Phần hiển thị dữ liệu, dùng lại cho mọi endpoint -->
<template id="tplData">
  <div class="card" id="kpiCard" hidden><h2 id="kpiTitle">Tổng quan</h2><div class="kpi" id="kpi"></div></div>

  <div class="card" id="tblCard" hidden>
    <h2 style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
      <span id="tblTitle"></span><span id="tblChip"></span>
    </h2>
    <div id="tbl"></div>
  </div>

  <div class="card">
    <details><summary>JSON thô</summary><pre id="raw" style="margin-top:11px">—</pre></details>
  </div>
</template>

<script>
const $ = (s, r) => (r || document).querySelector(s);
const esc = (v) => v == null ? '' : String(v)
  .replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = (v) => v == null || v === '' ? ''
  : Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const norm = (s) => String(s || '').toLowerCase()
  .normalize('NFD').replace(/[̀-ͯ]/g, '');
const initials = (n) => String(n || '?').replace(/[^\p{L}\p{N} ]/gu, '').trim()
  .split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '?';

let TEAMS = [];        // 62 team
let CUR = null;        // team đang chọn
let lastEp = null;     // endpoint dữ liệu đang xem

// ═══ 1. Danh sách team ══════════════════════════════════
async function loadTeams() {
  $('#tCount').textContent = 'đang tải…';
  try {
    const j = await fetch('/api/teams').then((r) => r.json());
    if (!j.success) { $('#tList').innerHTML = errBox(j.error); $('#tCount').textContent = '—'; return; }
    TEAMS = j.teams;
    $('#tCount').textContent = j.count + ' team · ' + j.with_token + ' có token';
    renderList();
    // Tự chọn team có billing
    const auto = TEAMS.find((t) => t.has_billing);
    if (auto) selectTeam(auto.uuid);
  } catch (e) {
    $('#tList').innerHTML = errBox(e.message);
  }
}

const errBox = (m) => '<div class="empty"><b>Không tải được danh sách team</b>'
  + '<span>' + esc(m) + '</span></div>';

function renderList() {
  const q = norm($('#tSearch').value.trim());
  const rows = q
    ? TEAMS.filter((t) => norm(t.name).includes(q) || norm(t.email).includes(q))
    : TEAMS;

  if (!rows.length) {
    $('#tList').innerHTML = '<div class="empty"><b>Không có team khớp</b>'
      + '<span>Thử từ khóa khác.</span></div>';
    return;
  }
  $('#tList').innerHTML = rows.map((t) =>
    '<button class="titem' + (t.has_billing ? ' ok' : '')
    + (CUR === t.uuid ? ' on' : '') + '" data-uuid="' + esc(t.uuid) + '" type="button">'
    + '<span class="av">' + esc(initials(t.name)) + '</span>'
    + '<span class="tx"><span class="tn">' + esc(t.name) + '</span>'
    + '<span class="te">' + esc(t.email || t.user_role) + '</span></span>'
    + '<span class="bd">' + (t.has_billing ? 'billing' : t.user_role) + '</span>'
    + '</button>').join('');

  $('#tList').querySelectorAll('.titem').forEach((b) => {
    b.onclick = () => selectTeam(b.dataset.uuid);
  });
}

// ═══ 2. Chọn team → nạp chi tiết ════════════════════════
async function selectTeam(uuid) {
  CUR = uuid;
  renderList();
  const t = TEAMS.find((x) => x.uuid === uuid) || {};
  $('#pane').innerHTML = '<div class="card ph-empty"><div>'
    + '<div class="ic">◴</div>Đang tải ' + esc(t.name) + '…</div></div>';

  try {
    const j = await fetch('/api/teams/' + encodeURIComponent(uuid) + '/overview')
      .then((r) => r.json());
    if (!j.success) { paneError(t, j.error); return; }
    renderPane(j);
  } catch (e) { paneError(t, e.message); }
}

function paneError(t, msg) {
  $('#pane').innerHTML = header(t, '')
    + '<div class="card"><div class="noauth"><div class="ic">⚠</div>'
    + '<b>Không tải được dữ liệu</b><p>' + esc(msg) + '</p></div></div>';
}

function header(t, subExtra, acts) {
  return '<div class="ph"><div class="av">' + esc(initials(t.name)) + '</div>'
    + '<div class="meta"><h2 class="nm">' + esc(t.name) + '</h2>'
    + '<div class="sub">' + (t.email ? esc(t.email) + ' · ' : '')
    + '<span>' + esc(t.user_role || '') + '</span>'
    + '<code>' + esc((t.uuid || '').slice(0, 13)) + '…</code>'
    + (subExtra || '') + '</div></div>'
    + '<div class="acts">' + (acts || '') + '</div></div>';
}

function renderPane(j) {
  const t = j.team;

  // Team không có token → nói rõ lý do
  if (!j.has_billing) {
    $('#pane').innerHTML = header(t, '', '<button class="p" id="bRecon" type="button">📋 Bảng đối soát</button>')
      + '<div class="card"><h2>Bảng đối soát</h2><div class="filter"><div class="fx">'
      + '<label for="month">Chọn kỳ</label><input type="month" id="month"></div></div>'
      + '<div class="st">Không có token của team này — bảng đối soát dùng billing từ file Bill (cột Q).</div></div>'
      + '<div class="card"><div class="noauth"><div class="ic">⊘</div>'
      + '<b>' + (j.has_token ? 'Token đã lưu không dùng được' : 'Team này chưa có token riêng') + '</b><p>' + esc(j.reason) + '</p>'
      + tokenForm(t, j.has_token)
      + '</div></div>';
    $('#month').value = shiftMonth(1);
    $('#bRecon').onclick = () => openRecon(t);
    wireTokenForm(t);
    return;
  }

  const acts = '<button class="p" id="bMonth" type="button">Tổng hợp tháng</button>'
    + '<button id="bRecon" type="button">📋 Bảng đối soát</button>'
    + '<button id="bInv" type="button">Invoices</button>'
    + '<button id="bHist" type="button">Lịch sử</button>'
    + '<button id="bBal" type="button">Số dư</button>'
    + '<button id="bTok" type="button" title="Đổi / xóa token của team">🔑 Token</button>';

  $('#pane').innerHTML = header(t, ' · <span class="tok" title="Token riêng của team">🔑 …' + esc(j.token_last4 || '') + '</span>', acts)
    + '<div class="card" id="tokCard" hidden><h2>Đổi token của team</h2>' + tokenForm(t, true) + '</div>'
    // KPI tổng quan team
    + '<div class="card"><h2>Tổng quan</h2><div class="kpi">'
    + [['Số kỳ hóa đơn', j.periods],
       ['Tổng đã phát sinh', '$' + money(j.total)],
       ['Kỳ gần nhất', j.last_period || '—'],
       ['Kỳ xa nhất', j.first_period || '—'],
       ['Preview tháng chạy', j.preview ? '$' + money(j.preview.amount) : '—']]
      .map((r) => '<div><span>' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>').join('')
    + '</div></div>'
    // Thanh chọn kỳ
    + '<div class="card"><h2>Kỳ cước</h2><div class="filter">'
    + '<div class="fx"><label for="month">Chọn kỳ</label><div class="stepper">'
    + '<button id="prev" type="button" title="Tháng trước">‹</button>'
    + '<input type="month" id="month">'
    + '<button id="next" type="button" title="Tháng sau">›</button></div></div>'
    + '<div class="fx"><label>Chọn nhanh</label><div class="seg">'
    + '<button data-q="0" type="button">Tháng này</button>'
    + '<button data-q="1" type="button">Tháng trước</button>'
    + '<button data-q="all" type="button">Tất cả</button></div></div>'
    + '</div><div class="st" id="status">Chọn kỳ rồi bấm một nguồn dữ liệu ở trên.</div></div>'
    // Khung dữ liệu
    + '<div class="card" id="kpiCard" hidden><h2 id="kpiTitle"></h2><div class="kpi" id="kpi"></div></div>'
    + '<div class="card" id="tblCard" hidden><h2 style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">'
    + '<span id="tblTitle"></span><span id="tblChip"></span></h2><div id="tbl"></div></div>'
    + '<div class="card"><details><summary>JSON thô</summary>'
    + '<pre id="raw" style="margin-top:11px">—</pre></details></div>';

  wireMonth();
  $('#bMonth').onclick = () => call('/api/month');
  $('#bRecon').onclick = () => openRecon(t);
  $('#bTok').onclick = () => { $('#tokCard').hidden = !$('#tokCard').hidden; };
  wireTokenForm(t);
  $('#bInv').onclick = () => call('/api/invoices');
  $('#bHist').onclick = () => call('/api/billing-history');
  $('#bBal').onclick = () => call('/api/balance');

  // Mặc định mở kỳ gần nhất
  if (j.last_period) { $('#month').value = j.last_period; syncMonth(); call('/api/month'); }
}

// ═══ 3. Bộ chọn kỳ ══════════════════════════════════════
const ym = (d) => d.toISOString().slice(0, 7);
const shiftMonth = (back) => {
  const d = new Date();
  return ym(new Date(d.getFullYear(), d.getMonth() - back, 1));
};
const period = () => { const m = $('#month'); return m && m.value ? m.value : null; };

function wireMonth() {
  const m = $('#month');
  m.max = shiftMonth(0);
  m.onchange = syncMonth;
  $('#prev').onclick = () => stepMonth(-1);
  $('#next').onclick = () => stepMonth(1);
  document.querySelectorAll('.seg button').forEach((b) => {
    b.onclick = () => {
      m.value = b.dataset.q === 'all' ? '' : shiftMonth(Number(b.dataset.q));
      syncMonth();
    };
  });
}

function stepMonth(d) {
  const m = $('#month');
  const p = period() || shiftMonth(0);
  const [y, mo] = p.split('-').map(Number);
  const v = ym(new Date(y, mo - 1 + d, 1));
  if (v > m.max) return;
  m.value = v; syncMonth();
}

function syncMonth() {
  const p = period();
  document.querySelectorAll('.seg button').forEach((b) => {
    const want = b.dataset.q === 'all' ? null : shiftMonth(Number(b.dataset.q));
    b.classList.toggle('on', want === p);
  });
  if (lastEp) call(lastEp);
}

// ═══ 4. Gọi API dữ liệu ═════════════════════════════════
function status(msg, cls, rl) {
  const el = $('#status'); if (!el) return;
  el.className = 'st' + (cls ? ' ' + cls : '');
  el.innerHTML = (cls === 'load' ? '<span class="sp"></span>' : '') + msg
    + (rl && rl.remaining ? '<span class="rl">rate limit ' + rl.remaining + '/' + rl.limit + '</span>' : '');
}

async function call(ep, o = {}) {
  if (!o.drill) lastEp = ep;
  const p = period();
  const NEED = ['/api/month'];
  const BY_MONTH = ['/api/month', '/api/invoices', '/api/billing-history'];
  if (NEED.includes(ep) && !p) {
    status('Endpoint này cần một kỳ cụ thể — chọn kỳ trước.', 'e'); return;
  }
  let url = ep;
  if (ep === '/api/month') url += '/' + p;
  else if (p && BY_MONTH.includes(ep)) url += '?month=' + p;

  status('Đang gọi <code>' + esc(url) + '</code> …', 'load');
  $('#kpiCard').hidden = true; $('#tblCard').hidden = true;
  const btns = $('.acts').querySelectorAll('button');
  btns.forEach((b) => { b.disabled = true; });
  try {
    const j = await fetch(url, { headers: CUR ? { 'X-DO-Team': CUR } : {} }).then((r) => r.json());
    $('#raw').textContent = JSON.stringify(j, null, 2);
    if (!j.success) { status('Lỗi: ' + esc(j.error), 'e'); return; }
    status('OK', 'o', j.rateLimit);
    render(j);
  } catch (e) { status('Lỗi mạng: ' + esc(e.message), 'e'); }
  finally { btns.forEach((b) => { b.disabled = false; }); }
}

function kpis(title, pairs) {
  $('#kpiTitle').textContent = title;
  $('#kpi').innerHTML = pairs.map((p) =>
    '<div><span>' + esc(p[0]) + '</span><b>' + esc(p[1] ?? '—') + '</b></div>').join('');
  $('#kpiCard').hidden = false;
}

function chip(text) {
  $('#tblChip').innerHTML = text
    ? '<span class="chip">' + esc(text) + '<button id="clr" title="Bỏ lọc kỳ">×</button></span>' : '';
  const c = $('#clr');
  if (c) c.onclick = () => { $('#month').value = ''; syncMonth(); };
}

function render(j) {
  // Kỳ không có hóa đơn
  if (j.range && j.report === null) {
    kpis('Kỳ ' + j.month, [['Kỳ', j.month],
      ['Khoảng ngày', j.range.start + ' → ' + j.range.end], ['Hóa đơn', 'không có']]);
    $('#tblTitle').textContent = 'Kỳ ' + j.month;
    $('#tbl').innerHTML = '<div class="empty"><b>Kỳ này không có hóa đơn</b>'
      + '<span>Team chưa phát sinh cước trong kỳ, hoặc hóa đơn chưa được DO chốt.</span></div>';
    $('#tblCard').hidden = false;
    return;
  }

  // Hóa đơn đầy đủ (từ /api/month hoặc /api/invoices/:uuid/report)
  if (j.report) { invoice(j.report, j); return; }

  if (j.invoices) {
    kpis('Invoices' + (j.month ? ' — kỳ ' + j.month : ' — tất cả kỳ'), [
      ['Số invoice', j.count + (j.month ? ' / ' + j.total_all : '')],
      ['Tổng tiền', '$' + money(j.total)],
      ['Preview', j.preview ? '$' + money(j.preview.amount) : '—'],
    ]);
    chip(j.month ? 'kỳ ' + j.month : null);
    table(j.invoices, [['invoice_period', 'Kỳ'], ['amount', 'Số tiền (USD)', 'n'],
      ['invoice_id', 'Invoice #'], ['invoice_uuid', 'UUID', 'mono']],
      { total: { col: 'amount', value: j.total },
        onClick: (r) => call('/api/invoices/' + r.invoice_uuid + '/report', { drill: true }) });
    return;
  }

  if (j.billing_history) {
    kpis('Lịch sử billing' + (j.month ? ' — kỳ ' + j.month : ''), [
      ['Số bản ghi', j.count + (j.month ? ' / ' + j.total_all : '')],
      ['Tổng amount', '$' + money(j.total)],
    ]);
    chip(j.month ? 'kỳ ' + j.month : null);
    table(j.billing_history, [['date', 'Ngày'], ['type', 'Loại'],
      ['amount', 'Số tiền', 'n'], ['description', 'Diễn giải'],
      ['invoice_uuid', 'UUID', 'mono']], { total: { col: 'amount', value: j.total } });
    return;
  }

  if (j.balance) {
    const b = j.balance;
    kpis('Số dư tài khoản', [
      ['Account balance', '$' + money(b.account_balance)],
      ['Month-to-date balance', '$' + money(b.month_to_date_balance)],
      ['Month-to-date usage', '$' + money(b.month_to_date_usage)],
      ['Generated at', (b.generated_at || '').replace('T', ' ').replace('Z', '')],
    ]);
  }
}

function table(rows, cols, o = {}) {
  $('#tblTitle').textContent = o.title || ('Dữ liệu (' + rows.length + ' dòng)');
  if (!rows.length) {
    $('#tbl').innerHTML = '<div class="empty"><b>Không có dữ liệu</b>'
      + '<span>Kỳ đã chọn không có bản ghi. Thử kỳ khác hoặc bấm “Tất cả”.</span></div>';
    $('#tblCard').hidden = false; return;
  }
  const head = '<tr>' + cols.map((c) =>
    '<th class="' + (c[2] === 'n' ? 'n' : '') + '">' + esc(c[1]) + '</th>').join('') + '</tr>';
  const body = rows.slice(0, 1000).map((r, i) =>
    '<tr class="' + (o.onClick ? 'clk' : '') + '" data-i="' + i + '">'
    + cols.map((c) => '<td class="' + (c[2] || '') + '">'
      + esc(c[2] === 'n' && c[0] !== 'count' ? money(r[c[0]]) : r[c[0]]) + '</td>').join('')
    + '</tr>').join('');
  let foot = '';
  if (o.total) {
    foot = '<tfoot><tr>' + cols.map((c, i) => '<td class="' + (c[2] === 'n' ? 'n' : '') + '">'
      + (i === 0 ? 'Tổng' : c[0] === o.total.col ? '$' + money(o.total.value) : '')
      + '</td>').join('') + '</tr></tfoot>';
  }
  $('#tbl').innerHTML = '<div class="tw"><table><thead>' + head + '</thead><tbody>'
    + body + '</tbody>' + foot + '</table></div>';
  if (o.onClick) {
    $('#tbl').querySelectorAll('tr.clk').forEach((tr) => {
      tr.onclick = () => o.onClick(rows[Number(tr.dataset.i)]);
    });
  }
  $('#tblCard').hidden = false;
}

// ── Render hóa đơn theo bố cục chứng từ PDF ─────────────
function invoice(r, ctx) {
  const s = r.summary, inf = r.info, T = r.totals;
  ctx = ctx || {};
  const m = (v) => '$' + money(v);
  const signed = (v) => (Number(v) < 0 ? '-$' : '$') + money(Math.abs(v));

  $('#kpiCard').hidden = true;      // header riêng của hóa đơn đã đủ
  $('#tblTitle').textContent = 'Hóa đơn ' + (inf.period || '');
  $('#tblChip').innerHTML = ctx.range
    ? (r.is_preview ? '<span class="chip">bản preview, chưa chốt</span>' : '')
    : '<a href="#" id="back">‹ về danh sách kỳ</a>';

  const H = [];
  H.push('<div class="doc">');

  // ── Đầu hóa đơn ─────────────────────────────────────
  H.push('<div class="doc-top">'
    + '<div class="who"><div class="vendor">DigitalOcean LLC'
    + '<span>Hóa đơn cước dịch vụ hạ tầng'
    + (inf.user_company || inf.user_name ? ' · ' + esc(inf.user_company || inf.user_name) : '')
    + '</span></div></div>'
    + '<div class="right"><div class="lbl">Invoice number</div>'
    + '<div class="num">' + esc(inf.invoice_id || '—') + '</div>'
    + '<div class="per">Kỳ cước <b>' + esc(inf.period || ctx.month || '—') + '</b>'
    + (inf.issue_date ? ' · phát hành ' + esc(inf.issue_date) : '')
    + (r.is_preview ? ' · <b style="color:var(--warn)">PREVIEW</b>' : '') + '</div></div>'
    + '</div>');

  // ── Dải tiền ────────────────────────────────────────
  H.push('<div class="doc-sum">'
    + '<div><div class="k">Total usage charges</div><div class="v">' + m(s.usage_charges) + '</div></div>'
    + (s.overages ? '<div><div class="k">Overages</div><div class="v">' + m(s.overages) + '</div></div>' : '')
    + (s.adjustments_total ? '<div><div class="k">Giảm giá / điều chỉnh</div>'
        + '<div class="v neg">' + signed(s.adjustments_total) + '</div></div>' : '')
    + (s.taxes ? '<div><div class="k">Thuế</div><div class="v">' + m(s.taxes) + '</div></div>' : '')
    + '<div class="due"><div class="k">Total due</div><div class="v">' + m(s.amount_due) + '</div></div>'
    + '</div>');

  H.push('<div class="doc-body">');

  // ── 1. Thông tin hóa đơn ────────────────────────────
  H.push('<div class="doc-sec"><span class="n">1</span>Thông tin hóa đơn</div>');
  const kv = [
    ['Kỳ cước', inf.period, ''],
    ['Invoice number', inf.invoice_id, ''],
    ['Ngày phát hành', inf.issue_date, ''],
    ['Hạn thanh toán', inf.due_date, ''],
    ['Khách hàng', inf.user_company || inf.user_name, ''],
    ['Email', inf.user_email, 'mono'],
    ['Địa chỉ', inf.billing_address ? [inf.billing_address.address_line1,
      inf.billing_address.city, inf.billing_address.region,
      inf.billing_address.country_iso2_code].filter(Boolean).join(', ') : '', ''],
    ['Invoice UUID', r.invoice_uuid, 'mono'],
  ].filter((x) => x[1]);
  H.push('<div class="kv">' + kv.map((x) =>
    '<div><div class="k">' + esc(x[0]) + '</div>'
    + '<div class="v ' + x[2] + '">' + esc(x[1]) + '</div></div>').join('') + '</div>');

  // ── 3. Tổng hợp ─────────────────────────────────────
  H.push('<div class="doc-sec"><span class="n">3</span>Tổng hợp (Summary)</div>');
  H.push('<table class="tot"><tbody>');
  H.push('<tr><td>Total usage charges</td><td class="n">' + m(s.usage_charges) + '</td></tr>');
  if (s.overages) H.push('<tr><td>Overages</td><td class="n">' + m(s.overages) + '</td></tr>');
  s.adjustments.forEach((a) => {
    const neg = Number(a.amount) < 0;
    H.push('<tr><td>' + esc(a.name) + '</td><td class="n' + (neg ? ' neg' : '') + '">'
      + signed(a.amount) + '</td></tr>');
  });
  if (s.taxes) H.push('<tr><td>Taxes</td><td class="n">' + m(s.taxes) + '</td></tr>');
  H.push('<tr class="due"><td>Total due</td><td class="n">' + m(s.amount_due) + '</td></tr>');
  H.push('</tbody></table>');

  // ── 4. Chi phí theo sản phẩm ────────────────────────
  H.push('<div class="doc-sec"><span class="n">4</span>Chi phí theo sản phẩm'
    + ' <span style="text-transform:none;letter-spacing:0;font-weight:450">'
    + '(' + r.groups.length + ' nhóm · ' + T.charge_items_count + ' hạng mục)</span></div>');

  const max = Math.max(...r.groups.map((g) => Math.abs(g.subtotal)), 0.01);
  H.push('<div class="tw grp" style="max-height:none"><table><thead><tr>'
    + '<th>Nhóm sản phẩm</th><th class="n">Hạng mục</th><th class="n">Subtotal</th>'
    + '<th class="bar-c"></th></tr></thead><tbody>');
  r.groups.forEach((g) => {
    const pct = Math.abs(g.subtotal) / max * 100;
    const share = T.groups_total ? (g.subtotal / T.groups_total * 100) : 0;
    H.push('<tr><td>' + esc(g.name) + '</td>'
      + '<td class="n">' + g.count + '</td>'
      + '<td class="n">' + m(g.subtotal) + '</td>'
      + '<td class="bar-c"><div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>'
      + '<span class="pct">' + share.toFixed(1) + '%</span></td></tr>');
  });
  H.push('</tbody><tfoot><tr><td>Tổng cước</td><td class="n">' + T.charge_items_count
    + '</td><td class="n">' + m(T.groups_total) + '</td><td class="bar-c"></td></tr></tfoot>'
    + '</table></div>');

  // Từng nhóm → bảng hạng mục, mở sẵn tất cả
  H.push('<div class="gtools">'
    + '<button type="button" id="gAll">Mở tất cả</button>'
    + '<button type="button" id="gNone">Thu gọn tất cả</button>'
    + '<span class="gnote">' + r.groups.length + ' nhóm · '
    + T.charge_items_count + ' hạng mục</span></div>');
  r.groups.forEach((g, gi) => {
    H.push('<details class="gsec" open>'
      + '<summary>' + esc(g.name)
      + '<span class="cnt">' + g.count + ' hạng mục</span>'
      + '<span class="amt">' + m(g.subtotal) + '</span></summary>');

    // Nhóm gom được theo size (Droplets) -> 2 chế độ xem như PDF
    if (g.by_size) {
      H.push('<div class="vmode" data-g="' + gi + '">'
        + '<button type="button" class="on" data-v="size">Gom theo size'
        + '<span class="c">' + g.by_size.length + '</span></button>'
        + '<button type="button" data-v="line">Từng tài nguyên'
        + '<span class="c">' + g.count + '</span></button>'
        + '<span class="vnote">PDF của DigitalOcean in theo cách gom</span></div>');

      H.push('<div class="tw vw" data-g="' + gi + '" data-v="size"><table><thead><tr>'
        + '<th>Cấu hình</th><th class="n">Collective usage</th>'
        + '<th class="n">Giờ</th><th class="n">Amount</th></tr></thead><tbody>');
      g.by_size.forEach((x) => {
        H.push('<tr><td>' + esc(x.label || x.size) + '</td>'
          + '<td class="n">' + x.instances + ' instances</td>'
          + '<td class="n">' + Number(x.hours).toLocaleString('en-US') + ' hrs</td>'
          + '<td class="n">' + m(x.amount) + '</td></tr>');
      });
      H.push('</tbody><tfoot><tr><td>Tổng</td><td class="n">' + g.count + ' instances</td>'
        + '<td class="n"></td><td class="n">' + m(g.subtotal) + '</td></tr></tfoot>'
        + '</table></div>');
    }

    H.push('<div class="tw vw' + (g.by_size ? ' hid' : '') + '" data-g="' + gi + '" data-v="line">'
      + '<table><thead><tr><th>Hạng mục</th><th class="n">Hours</th>'
      + '<th>Start</th><th>End</th><th class="n">Amount</th></tr></thead><tbody>');
    g.lines.forEach((l) => {
      H.push('<tr><td>' + esc(l.description) + '</td>'
        + '<td class="n">' + esc(l.hours || '—') + '</td>'
        + '<td class="mono">' + esc(l.start || '—') + '</td>'
        + '<td class="mono">' + esc(l.end || '—') + '</td>'
        + '<td class="n">' + m(l.amount) + '</td></tr>');
    });
    H.push('</tbody></table></div></details>');
  });

  // ── Phân bổ theo project (nếu DO có gán) ────────────
  const byProj = {};
  r.groups.forEach((g) => g.lines.forEach((l) => {
    if (!l.project) return;
    byProj[l.project] = (byProj[l.project] || 0) + Number(l.amount || 0);
  }));
  const projs = Object.entries(byProj).sort((a, b) => b[1] - a[1]);
  if (projs.length) {
    H.push('<div class="doc-sec"><span class="n">4b</span>Phân bổ theo project</div>');
    const pmax = Math.max(...projs.map((x) => Math.abs(x[1])), 0.01);
    H.push('<div class="tw grp" style="max-height:none"><table><thead><tr>'
      + '<th>Project</th><th class="n">Số tiền</th><th class="bar-c"></th>'
      + '</tr></thead><tbody>');
    projs.forEach(([name, amt]) => {
      H.push('<tr><td>' + esc(name) + '</td><td class="n">' + m(amt) + '</td>'
        + '<td class="bar-c"><div class="bar"><i style="width:'
        + (Math.abs(amt) / pmax * 100).toFixed(1) + '%"></i></div></td></tr>');
    });
    H.push('</tbody></table></div>');
  }

  // ── 5. Đối chiếu tự động ────────────────────────────
  H.push('<div class="doc-sec"><span class="n">5</span>Đối chiếu tự động</div>');
  H.push('<div class="chk">');
  r.checks.forEach((c) => {
    H.push('<div class="' + (c.ok ? 'y' : 'n') + '">'
      + '<span class="ic">' + (c.ok ? '✓' : '✕') + '</span>'
      + '<span class="lb">' + esc(c.label) + '</span>'
      + '<span class="vl">' + m(c.value) + '</span>'
      + '<span class="nt">' + esc(c.note) + '</span></div>');
  });
  H.push('</div>');

  const bad = r.checks.filter((c) => !c.ok).length;
  H.push('<div class="verdict ' + (r.all_ok ? 'y' : 'n') + '">'
    + (r.all_ok
      ? '✓ Khớp toàn bộ ' + r.checks.length + ' phép kiểm tra — số liệu dùng được để đối soát.'
      : '✕ ' + bad + '/' + r.checks.length + ' phép kiểm tra LỆCH — cần kiểm tra lại trước khi đối soát.')
    + '</div>');

  H.push('</div>');   // /doc-body

  // ── Nút tải ─────────────────────────────────────────
  H.push('<div class="doc-acts">'
    + '<a href="/api/invoices/' + esc(r.invoice_uuid) + '/report.md"><button type="button">Tải .md</button></a>'
    + '<a href="/api/invoices/' + esc(r.invoice_uuid) + '/csv"><button type="button">Tải CSV</button></a>'
    + '<button type="button" id="prt">In / lưu PDF</button>'
    + '</div>');

  H.push('</div>');   // /doc

  $('#tbl').innerHTML = H.join('');
  $('#tblCard').hidden = false;

  const bk = $('#back');
  if (bk) bk.onclick = (e) => { e.preventDefault(); call('/api/invoices'); };
  const pr = $('#prt');
  if (pr) pr.onclick = () => window.print();

  const setAll = (open) => {
    $('#tbl').querySelectorAll('details.gsec').forEach((d) => { d.open = open; });
  };
  const ga = $('#gAll'), gn = $('#gNone');
  if (ga) ga.onclick = () => setAll(true);
  if (gn) gn.onclick = () => setAll(false);

  $('#tbl').querySelectorAll('.vmode button').forEach((b) => {
    b.onclick = () => {
      const box = b.closest('.vmode'), gi = box.dataset.g, want = b.dataset.v;
      box.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
      $('#tbl').querySelectorAll('.vw[data-g="' + gi + '"]').forEach((v) => {
        v.classList.toggle('hid', v.dataset.v !== want);
      });
    };
  });
}




// ═══ 4b. Token riêng từng team ══════════════════════════════════
function tokenForm(t, hasToken) {
  return '<form class="tokf" id="tokForm" autocomplete="off">'
    + '<input type="password" id="tokInput" placeholder="dop_v1_… (Personal Access Token của team ' + esc(t.name) + ')" required>'
    + '<button class="p" type="submit" id="tokSave">' + (hasToken ? 'Cập nhật token' : 'Lưu token') + '</button>'
    + (hasToken ? '<button type="button" id="tokDel">Xóa token</button>' : '')
    + '</form><div class="tokmsg" id="tokMsg">Tạo token tại cloud.digitalocean.com → API → Tokens, khi đang chọn đúng team, '
    + 'scope <code>billing:read</code>. Token được kiểm tra với DigitalOcean rồi lưu mã hóa (AES-256-GCM), không hiển thị lại.</div>';
}

function wireTokenForm(t) {
  const f = $('#tokForm'); if (!f) return;
  const msg = (s, cls) => { const m = $('#tokMsg'); m.className = 'tokmsg ' + (cls || ''); m.textContent = s; };
  f.onsubmit = async (e) => {
    e.preventDefault();
    $('#tokSave').disabled = true; msg('Đang kiểm tra token với DigitalOcean…');
    try {
      const j = await fetch('/api/teams/' + encodeURIComponent(t.uuid) + '/token', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: $('#tokInput').value.trim() }) }).then((r) => r.json());
      if (!j.success) { msg(j.error, 'e'); return; }
      msg('Đã lưu token …' + j.token_last4 + ' (' + j.store.backend + ')', 'o');
      await loadTeamsKeep(t.uuid);
    } catch (err) { msg(err.message, 'e'); }
    finally { const b = $('#tokSave'); if (b) b.disabled = false; }
  };
  const del = $('#tokDel');
  if (del) del.onclick = async () => {
    if (!confirm('Xóa token của team ' + t.name + '?')) return;
    await fetch('/api/teams/' + encodeURIComponent(t.uuid) + '/token', { method: 'DELETE' });
    await loadTeamsKeep(t.uuid);
  };
}

/** Nạp lại danh sách team (cập nhật cờ có token) rồi mở lại team đang chọn */
async function loadTeamsKeep(uuid) {
  const j = await fetch('/api/teams').then((r) => r.json());
  if (j.success) { TEAMS = j.teams; $('#tCount').textContent = j.count + ' team · ' + j.with_token + ' có token'; }
  selectTeam(uuid);
}

// ═══ 5. Preview bảng đối soát của team ════════════════════════════
function reconModal(html) {
  let m = $('#reconModal');
  if (!m) {
    m = document.createElement('div');
    m.id = 'reconModal';
    m.className = 'rmodal';
    m.innerHTML = '<div class="rbox" role="dialog" aria-modal="true" aria-label="Bảng đối soát"></div>';
    m.onclick = (e) => { if (e.target === m) m.remove(); };
    document.body.appendChild(m);
    document.addEventListener('keydown', function onEsc(e) {
      if (e.key === 'Escape' && $('#reconModal')) { $('#reconModal').remove(); document.removeEventListener('keydown', onEsc); }
    });
  }
  $('.rbox', m).innerHTML = html;
  return m;
}

async function openRecon(t) {
  const p = period() || shiftMonth(1);
  reconModal('<div class="rhead"><b>Bảng đối soát — ' + esc(t.name) + ' — kỳ ' + esc(p) + '</b>'
    + '<button type="button" class="rclose">✕</button></div><div class="rbody"><span class="sp"></span> Đang lập bảng…</div>');
  $('#reconModal .rclose').onclick = () => $('#reconModal').remove();
  let j;
  try { j = await fetch('/api/teams/' + encodeURIComponent(t.uuid) + '/recon/' + p).then((r) => r.json()); }
  catch (e) { j = { success: false, error: e.message }; }

  const head = '<div class="rhead"><div><b>Bảng đối soát — kỳ ' + esc(p) + '</b>'
    + (j.success ? '<div class="rsub">Team ' + esc(t.name) + ' → khách <b>' + esc(j.customerCode) + '</b> · billing từ '
      + (j.source === 'api' ? '<span class="rtag ok">API DigitalOcean</span>' : '<span class="rtag">file Bill (cột Q)</span>')
      + (j.termsPeriod !== p ? ' · điều khoản kỳ ' + esc(j.termsPeriod) : '') + '</div>' : '')
    + '</div><button type="button" class="rclose">✕</button></div>';

  if (!j.success) {
    reconModal(head + '<div class="rbody"><div class="rwarn">' + esc(j.error) + '</div></div>');
  } else {
    const s = j.sheet;
    const warns = [...(j.warnings || []), ...((s && s.warnings) || [])];
    const cmp = j.api ? '<div class="rcmp"><span>Billing API <b>$' + money(j.api.usage) + '</b></span>'
      + '<span>File Bill <b>' + (j.excelBillingUsd == null ? '—' : '$' + money(j.excelBillingUsd)) + '</b></span>'
      + '<span>Phải trả hãng <b>$' + money(j.api.amountDue) + '</b></span></div>' : '';
    const body = s
      ? cmp + (warns.length ? '<div class="rwarn">' + warns.map((w) => '⚠ ' + esc(w)).join('<br>') + '</div>' : '')
        + '<div class="rprev" id="rPrev">' + s.html + '</div>'
        + '<div class="racts">'
        + '<button type="button" id="rCopy">⧉ Copy bảng (dán vào mail)</button>'
        + (j.termsPeriod === p ? '<a href="/api/recon/' + p + '/xlsx?org=' + encodeURIComponent(j.customerCode) + '"><button type="button">⬇ XLSX</button></a>'
          + '<a href="/recon.html#' + p + '"><button type="button" class="p">Mở trang Đối soát →</button></a>' : '')
        + '</div>'
      : '<div class="rwarn">' + warns.map((w) => '⚠ ' + esc(w)).join('<br>')
        + '<br>Không có phát sinh để lập bảng kỳ này.</div>';
    reconModal(head + '<div class="rbody">' + body + '</div>');
    const cp = $('#rCopy');
    if (cp) cp.onclick = async () => {
      const el = $('#rPrev');
      try {
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([el.innerHTML], { type: 'text/html' }),
          'text/plain': new Blob([el.innerText], { type: 'text/plain' }) })]);
        cp.textContent = '✓ Đã copy';
      } catch { cp.textContent = 'Trình duyệt chặn clipboard'; }
    };
  }
  $('#reconModal .rclose').onclick = () => $('#reconModal').remove();
}

document.querySelectorAll('button[data-ep]').forEach((b) => { b.onclick = () => call(b.dataset.ep); });
syncMonth();

// ═══ Khởi động ══════════════════════════════════════════
$('#tSearch').oninput = renderList;
fetch('/health').then((r) => r.json()).then((h) => {
  const el = $('#envPill');
  el.className = 'pill ' + (h.tokenFromEnv ? 'y' : 'n');
  el.innerHTML = '<i></i>' + (h.tokenFromEnv ? 'đã kết nối' : 'chưa cấu hình');
}).catch(() => {});
loadTeams();
</script>
</body>
