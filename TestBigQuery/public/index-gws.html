<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GWS Flex Query - CloudAZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --bg-card: rgba(17, 24, 39, 0.92);
      --bg-input: #111827;
      --border: #374151;
      --text: #f9fafb;
      --text-dim: #9ca3af;
      --text-muted: #6b7280;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --radius: 10px;
      --font: 'Inter', system-ui, sans-serif;
      --mono: 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding: 1.5rem;
    }

    /* Header */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-content h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }

    .header-content p {
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.2rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(59, 130, 246, 0.1);
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-outline {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    /* Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(8px);
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      align-items: flex-end;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .field label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field input, .field select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    .field input:focus, .field select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* Toggle Group */
    .toggle-group {
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .toggle-btn {
      padding: 0.6rem 1rem;
      background: transparent;
      color: var(--text-dim);
      border: none;
      font-family: var(--font);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .toggle-btn.active {
      background: var(--accent);
      color: white;
    }

    .toggle-btn:hover:not(.active) {
      background: rgba(59, 130, 246, 0.1);
    }

    /* Status */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-ok { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .badge-err { background: rgba(239, 68, 68, 0.15); color: #f87171; }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.8rem;
      margin-bottom: 1.5rem;
    }

    .stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.8rem 1rem;
      text-align: center;
    }

    .stat-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-val { font-size: 1.3rem; font-weight: 700; margin-top: 0.2rem; color: #34d399; }

    /* Table */
    .table-wrap {
      overflow-x: auto;
      max-height: 65vh;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    thead th {
      position: sticky;
      top: 0;
      background: #1e293b;
      color: #94a3b8;
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.7rem 0.8rem;
      text-align: left;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid rgba(55, 65, 81, 0.4);
      transition: background 0.15s;
    }

    tbody tr:hover { background: rgba(59, 130, 246, 0.06); }

    tbody td {
      padding: 0.55rem 0.8rem;
      white-space: nowrap;
      color: var(--text);
    }

    td.num {
      text-align: right;
      font-family: var(--mono);
      font-size: 0.82rem;
    }

    td.amount {
      color: #34d399;
      font-weight: 600;
    }

    /* Actions bar */
    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-box {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      font-size: 0.85rem;
      width: 260px;
      transition: border-color 0.2s;
    }

    .search-box:focus { outline: none; border-color: var(--accent); }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }

    .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.8rem; }

    /* Loading spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="header-content">
      <h1>📋 GWS Flex — Truy vấn cước theo kỳ</h1>
      <p>Chọn khoảng thời gian, bấm "Truy vấn" — dữ liệu lấy từ BigQuery</p>
    </div>
    <a href="/" class="btn">← Quay lại</a>
  </div>

  <!-- Filter -->
  <div class="card">
    <div class="filter-bar">
      <div class="field">
        <label>Từ ngày</label>
        <input type="date" id="dateFrom" value="2026-06-01">
      </div>
      <div class="field">
        <label>Đến ngày</label>
        <input type="date" id="dateTo" value="2026-06-30">
      </div>

      <div class="field">
        <label>Loại dữ liệu</label>
        <div class="toggle-group">
          <button class="toggle-btn active" data-type="all">Tất cả</button>
          <button class="toggle-btn" data-type="usage">Chỉ Usage (Flex)</button>
          <button class="toggle-btn" data-type="commitment">Chỉ Commitment</button>
        </div>
      </div>

      <button id="btnQuery" class="btn btn-primary">
        ▶ Truy vấn
      </button>
    </div>

    <div id="statusBar" class="status-bar hidden">
      <span id="statusText">Đang truy vấn...</span>
    </div>
  </div>

  <!-- Stats -->
  <div id="statsRow" class="stats hidden fade-in">
    <div class="stat">
      <div class="stat-label">Thời gian</div>
      <div class="stat-val" id="sTime">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Số dòng</div>
      <div class="stat-val" id="sRows">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Dữ liệu quét</div>
      <div class="stat-val" id="sBytes">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Tổng Amount</div>
      <div class="stat-val" id="sTotal">—</div>
    </div>
  </div>

  <!-- Results -->
  <div id="resultCard" class="card hidden fade-in">
    <div class="actions-bar">
      <div style="display:flex;gap:0.6rem;align-items:center;">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Lọc theo domain, SKU...">
        <span id="filterCount" style="font-size:0.8rem;color:var(--text-muted);white-space:nowrap;"></span>
      </div>
      <div style="display:flex;gap:0.5rem;">
        <button id="btnCopy" class="btn btn-outline">📋 Copy JSON</button>
        <button id="btnCsv" class="btn btn-outline">⬇️ Xuất CSV</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead id="tHead"></thead>
        <tbody id="tBody"></tbody>
      </table>
    </div>
  </div>

  <div id="emptyState" class="empty-state">
    <div class="icon">📊</div>
    <p>Chọn khoảng thời gian rồi bấm <strong>"Truy vấn"</strong></p>
  </div>

  <script>
    (function() {
      const FULL_TABLE = '`billing-data-cloudaz-resell.CloudAZ_GWS_billing_ds.reseller_billing_detailed_export_v1`';

      // DOM
      const dateFrom = document.getElementById('dateFrom');
      const dateTo = document.getElementById('dateTo');
      const btnQuery = document.getElementById('btnQuery');
      const statusBar = document.getElementById('statusBar');
      const statusText = document.getElementById('statusText');
      const statsRow = document.getElementById('statsRow');
      const sTime = document.getElementById('sTime');
      const sRows = document.getElementById('sRows');
      const sBytes = document.getElementById('sBytes');
      const sTotal = document.getElementById('sTotal');
      const resultCard = document.getElementById('resultCard');
      const tHead = document.getElementById('tHead');
      const tBody = document.getElementById('tBody');
      const searchInput = document.getElementById('searchInput');
      const filterCount = document.getElementById('filterCount');
      const emptyState = document.getElementById('emptyState');
      const btnCopy = document.getElementById('btnCopy');
      const btnCsv = document.getElementById('btnCsv');

      let queryType = 'all';
      let allRows = [];
      let columns = [];

      // Toggle buttons
      document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          queryType = btn.dataset.type;
        });
      });

      // Date helpers
      function getFrom() { return dateFrom.value || '2026-06-01'; }
      function getTo() { return dateTo.value || '2026-06-30'; }

      function buildSQL() {
        const from = getFrom();
        const to = getTo();

        let typeFilter = '';
        if (queryType === 'usage') {
          typeFilter = `\n  AND (SELECT value FROM UNNEST(system_labels) WHERE key = 'workspace.googleapis.com/usage_type') = 'FLEXIBLE_SEATS_ITEM'`;
        } else if (queryType === 'commitment') {
          typeFilter = `\n  AND (SELECT value FROM UNNEST(system_labels) WHERE key = 'workspace.googleapis.com/usage_type') != 'FLEXIBLE_SEATS_ITEM'`;
        }

        const dateCondition = `DATE(usage_start_time) >= '${from}' AND DATE(usage_start_time) <= '${to}'`;

        return `SELECT
  (SELECT value FROM UNNEST(system_labels)
     WHERE key = 'workspace.googleapis.com/domain_name')       AS domain_name,
  sku.description                                              AS subscription,
  COALESCE(
    (SELECT value FROM UNNEST(system_labels)
       WHERE key = 'workspace.googleapis.com/usage_type'),
    cost_type
  )                                                            AS description,
  (SELECT value FROM UNNEST(system_labels)
     WHERE key = 'workspace.googleapis.com/order_id')          AS order_name,
  MIN(DATE(usage_start_time))                                  AS start_date,
  MAX(DATE(usage_end_time))                                    AS end_date,
  MAX(usage.amount)                                            AS quantity,
  (SELECT value FROM UNNEST(system_labels)
     WHERE key = 'workspace.googleapis.com/purchase_order_id') AS po_number,
  ROUND(SUM(customer_cost), 2)                                 AS amount,
  billing_account_id                                           AS customer_id,
  sku.id                                                       AS sku_id,
  invoice.month                                                AS invoice_month
FROM ${FULL_TABLE}
WHERE ${dateCondition}
  AND cost_type = 'regular'
  AND LOWER(sku.description) != 'tax'${typeFilter}
GROUP BY domain_name, subscription, description, order_name, po_number, customer_id, sku_id, invoice_month
ORDER BY domain_name, start_date ASC`;
      }

      // Run query
      async function runQuery() {
        const sql = buildSQL();
        btnQuery.disabled = true;
        btnQuery.innerHTML = '<span class="spinner"></span> Đang truy vấn...';
        statusBar.classList.remove('hidden');
        statusText.innerHTML = '<span class="spinner"></span> Đang gửi lên BigQuery...';
        emptyState.classList.add('hidden');

        try {
          const res = await fetch('/api/query', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sql })
          });
          const result = await res.json();

          if (!result.success) {
            throw new Error(result.error + (result.tip ? '\n' + result.tip : ''));
          }

          allRows = result.rows;
          columns = result.columns;

          // Stats
          statsRow.classList.remove('hidden');
          sTime.textContent = result.meta.durationMs + ' ms';
          sRows.textContent = allRows.length.toLocaleString();
          sBytes.textContent = result.meta.bytesProcessed;

          // Tính tổng amount
          const totalAmount = allRows.reduce((sum, r) => sum + (parseFloat(r.amount) || 0), 0);
          sTotal.textContent = '$' + totalAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

          // Render
          renderTable(allRows);
          resultCard.classList.remove('hidden');
          statusText.innerHTML = `<span class="badge badge-ok">✓</span> Hoàn thành — ${allRows.length.toLocaleString()} dòng`;

        } catch (err) {
          statusText.innerHTML = `<span class="badge badge-err">✗</span> Lỗi: ${esc(err.message)}`;
          statsRow.classList.add('hidden');
          resultCard.classList.add('hidden');
        } finally {
          btnQuery.disabled = false;
          btnQuery.innerHTML = '▶ Truy vấn';
        }
      }

      function renderTable(rows) {
        const cols = columns.length ? columns : (rows.length ? Object.keys(rows[0]) : []);
        tHead.innerHTML = '<tr>' + cols.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>';

        if (rows.length === 0) {
          tBody.innerHTML = '<tr><td colspan="' + cols.length + '" style="text-align:center;padding:2rem;color:var(--text-muted);">Không có dữ liệu</td></tr>';
          return;
        }

        tBody.innerHTML = rows.map(row => {
          return '<tr>' + cols.map(c => {
            const v = row[c];
            if (v === null || v === undefined) return '<td>—</td>';
            if (c === 'amount') return `<td class="num amount">${Number(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>`;
            if (c === 'quantity' || c === 'start_date' || c === 'end_date') return `<td class="num">${v}</td>`;
            return `<td>${esc(String(v))}</td>`;
          }).join('') + '</tr>';
        }).join('');
      }

      // Search
      searchInput.addEventListener('input', () => {
        const q = searchInput.value.toLowerCase().trim();
        if (!q) {
          renderTable(allRows);
          filterCount.textContent = '';
          return;
        }
        const filtered = allRows.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q)));
        renderTable(filtered);
        filterCount.textContent = `${filtered.length} / ${allRows.length}`;
      });

      // Copy JSON
      btnCopy.addEventListener('click', () => {
        if (!allRows.length) return;
        navigator.clipboard.writeText(JSON.stringify(allRows, null, 2));
        btnCopy.textContent = '✅ Đã copy!';
        setTimeout(() => { btnCopy.textContent = '📋 Copy JSON'; }, 2000);
      });

      // Export CSV
      btnCsv.addEventListener('click', () => {
        if (!allRows.length) return;
        const cols = columns.length ? columns : Object.keys(allRows[0]);
        let csv = cols.join(',') + '\n';
        allRows.forEach(row => {
          csv += cols.map(c => {
            let v = row[c] ?? '';
            v = String(v).replace(/"/g, '""');
            return `"${v}"`;
          }).join(',') + '\n';
        });
        const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const from = dateFrom.value;
        const to = dateTo.value;
        a.download = `gws_flex_${from}_${to}_${queryType}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      });

      // Enter key
      document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runQuery();
      });

      btnQuery.addEventListener('click', runQuery);

      function esc(text) {
        return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
    })();
  </script>
</body>
</html>
